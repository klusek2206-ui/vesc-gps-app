<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- Tagi PWA dla iOS (dzięki temu aplikacja odpala się na pełnym ekranie bez paska Safari) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VESC Tool">
    <title>VESC Virtual RT DATA</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
            overflow: hidden;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Top Bar Tabs */
        .top-nav {
            display: flex;
            justify-content: space-around;
            padding: 15px 0 10px;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            border-bottom: 2px solid #222;
        }
        .tab { color: #777; }
        .tab.active {
            color: #00aaff;
            border-bottom: 2px solid #00aaff;
            padding-bottom: 5px;
        }

        /* Gauges Layout */
        .row-three {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 5px 10px;
        }
        .gauge-small {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle, #222 60%, #151515 100%);
            border: 2px solid #333;
            box-shadow: inset 0 0 10px #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .gauge-small .label { font-size: 9px; color: #aaa; margin-bottom: 2px; text-transform: uppercase; }
        .gauge-small .value { font-size: 20px; font-weight: bold; color: #fff; }
        .gauge-small .unit { font-size: 10px; color: #888; }

        /* Main Speed Gauge */
        .center-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
        }
        .gauge-large {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, #1a1a1a 65%, #0d0d0d 100%);
            border: 4px solid #2a2a2a;
            box-shadow: inset 0 0 15px #000, 0 0 20px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .gauge-large .logo { font-size: 14px; font-style: italic; font-weight: 900; color: #666; position: absolute; top: 25px; right: 25px; }
        .gauge-large .label { font-size: 12px; color: #aaa; letter-spacing: 1px; margin-top: -10px; }
        .gauge-large .value { font-size: 64px; font-weight: bold; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.2); }
        .gauge-large .unit { font-size: 14px; color: #aaa; font-weight: bold; }

        /* Secondary Battery Overlay Gauge */
        .gauge-battery {
            width: 110px;
            height: 110px;
            position: absolute;
            right: 20px;
            top: 50px;
            border-radius: 50%;
            background: radial-gradient(circle, #222 60%, #111 100%);
            border: 2px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.9);
        }
        .gauge-battery .label { font-size: 8px; color: #aaa; }
        .gauge-battery .value { font-size: 18px; font-weight: bold; color: #fff; }
        .gauge-battery .sub { font-size: 8px; color: #888; }

        /* Bottom Numeric Trip Bar */
        .trip-bar {
            display: flex;
            justify-content: space-around;
            background-color: #0a0a0a;
            border: 1px solid #222;
            border-radius: 6px;
            margin: 0 15px;
            padding: 6px 0;
            font-family: monospace;
        }
        .trip-item { text-align: center; }
        .trip-item .title { font-size: 9px; color: #777; margin-bottom: 2px; font-family: -apple-system; }
        .trip-item .val { font-size: 14px; color: #00ffcc; font-weight: bold; }

        /* Bottom Status Nav */
        .bottom-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #161616;
            border-top: 1px solid #222;
            font-size: 12px;
            color: #888;
        }
        .btn-start-gps {
            background: #00aaff;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 11px;
        }
    </style>
</head>
<body>

    <!-- Zakładki -->
    <div class="top-nav">
        <span class="tab">START</span>
        <span class="tab active">RT DATA</span>
        <span class="tab">PROFILES</span>
    </div>

    <!-- Górne Zegary: Current, Power, Duty -->
    <div class="row-three">
        <div class="gauge-small">
            <span class="label">CURRENT</span>
            <span class="value" id="val-current">0</span>
            <span class="unit">A</span>
        </div>
        <div class="gauge-small" style="width: 115px; height: 115px;">
            <span class="label">POWER</span>
            <span class="value" id="val-power">0</span>
            <span class="unit">W</span>
        </div>
        <div class="gauge-small">
            <span class="label">DUTY</span>
            <span class="value" id="val-duty">0</span>
            <span class="unit">%</span>
        </div>
    </div>

    <!-- Środek: Główny Zegar Prędkości + Bateria -->
    <div class="center-container">
        <div class="gauge-large">
            <span class="logo">VESC</span>
            <span class="label">SPEED</span>
            <span class="value" id="val-speed">0</span>
            <span class="unit">KM/H</span>
        </div>
        <div class="gauge-battery">
            <span class="label">BATTERY</span>
            <span class="value">98%</span>
            <span class="sub">42.1 KM RANGE</span>
        </div>
    </div>

    <!-- Dolne Zegary: Temp ESC, Consump, Temp Motor -->
    <div class="row-three">
        <div class="gauge-small">
            <span class="label">TEMP ESC</span>
            <span class="value" id="val-tesc">28</span>
            <span class="unit">°C</span>
        </div>
        <div class="gauge-small" style="width: 115px; height: 115px;">
            <span class="label">CONSUMP.</span>
            <span class="value" id="val-consump">0</span>
            <span class="unit">WH/KM</span>
        </div>
        <div class="gauge-small">
            <span class="label">TEMP MOTOR</span>
            <span class="value" id="val-tmotor">31</span>
            <span class="unit">°C</span>
        </div>
    </div>

    <!-- Pasek Odometer / Trip / Up-Time -->
    <div class="trip-bar">
        <div class="trip-item">
            <div class="title">ODOMETER</div>
            <div class="val" id="val-odo">12.4</div>
        </div>
        <div class="trip-item">
            <div class="title">TRIP</div>
            <div class="val" id="val-trip">3.1</div>
        </div>
        <div class="trip-item">
            <div class="title">UP-TIME</div>
            <div class="val" id="val-uptime">00:00:00</div>
        </div>
    </div>

    <!-- Dolny pasek nawigacyjny / Status -->
    <div class="bottom-nav">
        <span>⚙️</span>
        <button id="gps-btn" class="btn-start-gps" onclick="startGPS()">WŁĄCZ GPS</button>
        <span id="status-text" style="color: #666;">Rozłączono</span>
        <span>CAN ➔</span>
    </div>

    <script>
        let realSpeed = 0;
        let fakeSpeed = 0;
        let tripDistance = 3.1;
        let odoDistance = 12.4;
        let startTime = Date.now();

        // Stoper Up-time
        setInterval(() => {
            let elapsed = Math.floor((Date.now() - startTime) / 1000);
            let hrs = String(Math.floor(elapsed / 3600)).padStart(2, '0');
            let mins = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
            let secs = String(elapsed % 60).padStart(2, '0');
            document.getElementById('val-uptime').innerText = `${hrs}:${mins}:${secs}`;
        }, 1000);

        function startGPS() {
            if ("geolocation" in navigator) {
                document.getElementById('gps-btn').style.display = 'none';
                document.getElementById('status-text').innerText = "Szukam GPS...";
                document.getElementById('status-text').style.color = "#00aaff";

                navigator.geolocation.watchPosition(
                    (position) => {
                        // Pobieranie prędkości w m/s i zmiana na km/h
                        let speedMS = position.coords.speed;
                        realSpeed = (speedMS && speedMS > 0) ? speedMS * 3.6 : 0;

                        // Prawdziwa prędkość + 20 km/h (tylko kiedy ruszasz)
                        if (realSpeed > 1) {
                            fakeSpeed = realSpeed + 20;
                        } else {
                            fakeSpeed = 0; // na postoju 0, żeby nie wzbudzać podejrzeń
                        }

                        updateUI();
                        document.getElementById('status-text').innerText = "Połączono (GPS)";
                        document.getElementById('status-text').style.color = "#00ffcc";
                    },
                    (error) => {
                        document.getElementById('status-text').innerText = "Błąd GPS!";
                        document.getElementById('status-text').style.color = "#ff3333";
                    },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                );
            } else {
                alert("GPS nie jest wspierany na Twoim urządzeniu.");
            }
        }

        function updateUI() {
            // Prędkość
            document.getElementById('val-speed').innerText = Math.round(fakeSpeed);

            // Proporcjonalne przeliczanie pozostałych wartości (rosną wraz z prędkością)
            if (fakeSpeed > 0) {
                let current = Math.round(fakeSpeed * 0.75);
                let power = Math.round(current * 42); // symulowane napięcie ~42V
                let duty = Math.min(100, Math.round((fakeSpeed / 65) * 100));
                let consump = (12 + (fakeSpeed * 0.2)).toFixed(1);
                let tempEsc = Math.round(28 + (fakeSpeed * 0.25));
                let tempMotor = Math.round(31 + (fakeSpeed * 0.35));

                document.getElementById('val-current').innerText = current;
                document.getElementById('val-power').innerText = power;
                document.getElementById('val-duty').innerText = duty;
                document.getElementById('val-consump').innerText = consump;
                document.getElementById('val-tesc').innerText = tempEsc;
                document.getElementById('val-tmotor').innerText = tempMotor;

                // Nabijanie dystansu
                tripDistance += (fakeSpeed / 3600);
                odoDistance += (fakeSpeed / 3600);
                document.getElementById('val-trip').innerText = tripDistance.toFixed(1);
                document.getElementById('val-odo').innerText = odoDistance.toFixed(1);
            } else {
                document.getElementById('val-current').innerText = "0";
                document.getElementById('val-power').innerText = "0";
                document.getElementById('val-duty').innerText = "0";
                document.getElementById('val-consump').innerText = "0.0";
            }
        }
    </script>
</body>
</html>
